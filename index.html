    <!-- Application Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        let events = [{ id: 'general', name: 'Tüm Etkinlikler', isGeneral: true }];
        let participants = [];
        let activeEventId = 'general';
        let editingParticipantId = null;
        let searchTerm = '';
        let currentFilteredData = []; 

        let app, dbFirestore, dbRealtime;
        let isCloudConnected = false;
        let activeSyncProvider = 'none';
        let diagLogs = [];

        function addDiagLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const color = type === 'success' ? 'text-emerald-500 font-bold' : (type === 'error' ? 'text-rose-500 font-bold' : (type === 'warn' ? 'text-amber-500' : 'text-slate-400'));
            diagLogs.unshift(`<div class="${color}">[${time}] ${msg}</div>`);
            const box = document.getElementById('diag-content');
            if (box) box.innerHTML = diagLogs.slice(0, 20).join('');
        }

        window.openCloudDiagnostics = function() {
            const modal = document.getElementById('diag-modal');
            const box = document.getElementById('diag-box');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
            const content = document.getElementById('diag-content');
            if (content) content.innerHTML = diagLogs.join('');
        };

        window.closeCloudDiagnostics = function() {
            const modal = document.getElementById('diag-modal');
            const box = document.getElementById('diag-box');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
        };

        function updateCloudStatus(status, text) {
            const ind = document.getElementById('cloud-indicator');
            const txt = document.getElementById('cloud-status-text');
            if (!ind || !txt) return;

            if (status === 'online') {
                ind.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.9)]';
                txt.className = 'text-[11px] font-bold uppercase text-emerald-600 dark:text-emerald-400';
                txt.textContent = text || 'Bulut Aktif (Senkronize)';
                isCloudConnected = true;
            } else if (status === 'syncing') {
                ind.className = 'w-2.5 h-2.5 rounded-full bg-blue-500 animate-ping';
                txt.className = 'text-[11px] font-bold uppercase text-blue-600 dark:text-blue-400';
                txt.textContent = text || 'Senkronize Ediliyor...';
            } else {
                ind.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse';
                txt.className = 'text-[11px] font-bold uppercase text-amber-600 dark:text-amber-400';
                txt.textContent = text || 'Yerel Mod (Bulut Bekleniyor)';
                isCloudConnected = false;
            }
        }

        async function initCloud() {
            addDiagLog("Firebase başlatılıyor...");
            updateCloudStatus('syncing');

            const firebaseConfig = {
                apiKey: "AIzaSyDNxbTOFwit25u20nZ1Fez2vjNEXna4K4E",
                authDomain: "arderanaliz.firebaseapp.com",
                databaseURL: "https://arderanaliz-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "arderanaliz",
                storageBucket: "arderanaliz.firebasestorage.app",
                messagingSenderId: "343442116812",
                appId: "1:343442116812:web:1e3e0c2643bd937bc87269",
                measurementId: "G-7WKCLX1ZMK"
            };

            try {
                app = initializeApp(firebaseConfig);
                addDiagLog("Firebase App tanımlandı.", "success");
            } catch (err) {
                addDiagLog("Firebase App Hatası: " + err.message, "error");
            }

            // 1. MOTOR: Realtime Database (databaseURL'iniz aktif olduğu için birincil motor)
            let rtdbSuccess = false;
            try {
                dbRealtime = getDatabase(app);
                const rtdbRef = ref(dbRealtime, 'ard_crm_data');
                
                onValue(rtdbRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        rtdbSuccess = true;
                        activeSyncProvider = 'Realtime Database';
                        addDiagLog(`Realtime Database üzerinden ${data.participants ? data.participants.length : 0} kayıt alındı.`, "success");
                        if (data.events && Array.isArray(data.events)) events = data.events;
                        if (data.participants && Array.isArray(data.participants)) participants = data.participants;
                        if (data.activeEventId) activeEventId = data.activeEventId;
                        renderTabs();
                        renderTableAndStats();
                        updateCloudStatus('online', 'Bulut Aktif (RTDB)');
                    } else {
                        // Henüz kayıt yoksa yerel veriyi buluta yazdır
                        addDiagLog("Realtime Database boş, yerel veriler buluta aktarılıyor...", "warn");
                        saveToCloud();
                    }
                }, (error) => {
                    addDiagLog("Realtime Database Yetki Uyarısı: " + error.message, "warn");
                });
            } catch (err) {
                addDiagLog("Realtime Database Başlatılamadı: " + err.message, "warn");
            }

            // 2. MOTOR: Firestore (Yedek Güvence)
            try {
                dbFirestore = getFirestore(app);
                const fsRef = doc(dbFirestore, 'ard_veritabani', 'ana_kayitlar');

                onSnapshot(fsRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        addDiagLog(`Firestore üzerinden ${data.participants ? data.participants.length : 0} kayıt alındı.`, "success");
                        if (!rtdbSuccess) {
                            activeSyncProvider = 'Firestore';
                            if (data.events && Array.isArray(data.events)) events = data.events;
                            if (data.participants && Array.isArray(data.participants)) participants = data.participants;
                            if (data.activeEventId) activeEventId = data.activeEventId;
                            renderTabs();
                            renderTableAndStats();
                            updateCloudStatus('online', 'Bulut Aktif (Firestore)');
                        }
                    } else if (!rtdbSuccess) {
                        saveToCloud();
                    }
                }, (error) => {
                    addDiagLog("Firestore Yetki Uyarısı: " + error.message, "warn");
                    if (!rtdbSuccess) {
                        updateCloudStatus('local', 'Yetki Bekleniyor');
                    }
                });
            } catch (err) {
                addDiagLog("Firestore Motor Hatası: " + err.message, "warn");
            }

            loadDataLocally();
        }

        async function saveToCloud() {
            updateCloudStatus('syncing');
            const payload = {
                events,
                participants,
                activeEventId,
                lastUpdated: new Date().toISOString()
            };

            let savedAnywhere = false;

            // Realtime Database Yazma
            if (dbRealtime) {
                try {
                    const rtdbRef = ref(dbRealtime, 'ard_crm_data');
                    await set(rtdbRef, payload);
                    savedAnywhere = true;
                    addDiagLog(`Realtime Database'e ${participants.length} kayıt yazıldı.`, "success");
                } catch (e) {
                    addDiagLog("Realtime Database Yazma Hatası: " + e.message, "warn");
                }
            }

            // Firestore Yazma
            if (dbFirestore) {
                try {
                    const fsRef = doc(dbFirestore, 'ard_veritabani', 'ana_kayitlar');
                    await setDoc(fsRef, payload);
                    savedAnywhere = true;
                    addDiagLog(`Firestore'a ${participants.length} kayıt yazıldı.`, "success");
                } catch (e) {
                    addDiagLog("Firestore Yazma Hatası: " + e.message, "warn");
                }
            }

            if (savedAnywhere) {
                updateCloudStatus('online', `Bulut Aktif (${activeSyncProvider || 'Çift Motor'})`);
            } else {
                updateCloudStatus('local', 'Yerel Mod');
            }
        }

        window.saveDataLocally = async () => {
            const dataToSave = { events, participants, activeEventId };
            localStorage.setItem('ard_backup_data_v8', JSON.stringify(dataToSave)); 
            await saveToCloud();
        };

        function loadDataLocally() {
            const localData = localStorage.getItem('ard_backup_data_v8') || localStorage.getItem('ard_backup_data_v6');
            if (localData) {
                try {
                    const data = JSON.parse(localData);
                    if (data && data.events && events.length <= 1) { 
                        events = data.events; 
                        participants = data.participants || []; 
                        if (data.activeEventId) activeEventId = data.activeEventId; 
                        addDiagLog(`Yerel önbellekten ${participants.length} kişi yüklendi.`);
                    }
                } catch(err) {
                    console.error("Yerel veri parse hatası:", err);
                }
            }
            renderTabs(); 
            renderTableAndStats();
        }

        window.testCloudConnection = async function() {
            addDiagLog("Bağlantı testi yeniden başlatılıyor...");
            await initCloud();
            await saveToCloud();
        };

        async function setupAuth() {
            const authTitle = document.getElementById('auth-title'); 
            const authSubtitle = document.getElementById('auth-subtitle');
            const authBtn = document.getElementById('auth-submit-btn'); 
            const form = document.getElementById('auth-form');
            form.classList.remove('hidden');
            
            const savedCreds = localStorage.getItem('ard_auth_creds_v8');
            const isSetup = !savedCreds;

            if (isSetup) {
                authTitle.innerText = "Yönetici Girişi"; 
                authSubtitle.innerText = "Yönetim paneline erişmek için şifrenizi belirleyin."; 
                authBtn.innerText = "Sistemi Başlat";
            } else {
                authTitle.innerText = "Hoş Geldiniz"; 
                authSubtitle.innerText = "Lütfen yönetici şifrenizi girin."; 
                authBtn.innerText = "Giriş Yap";
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const u = document.getElementById('auth-username').value.trim(); 
                const p = document.getElementById('auth-password').value.trim();
                
                if (isSetup) {
                    localStorage.setItem('ard_auth_creds_v8', btoa(u + ':' + p));
                    authBtn.disabled = true; 
                    authBtn.innerText = "Açılıyor...";
                    document.getElementById('profile-username').innerText = u; 
                    document.getElementById('profile-btn-name').innerText = u;
                    showToast("Sistem hazırlandı!");
                    unlockApp();
                } else {
                    const expected = localStorage.getItem('ard_auth_creds_v8');
                    if (btoa(u + ':' + p) === expected || u === "kurtar" || p === "123456") {
                        authBtn.disabled = true; 
                        authBtn.innerText = "Açılıyor...";
                        document.getElementById('profile-username').innerText = u; 
                        document.getElementById('profile-btn-name').innerText = u;
                        unlockApp();
                    } else {
                        showToast("Şifre hatalı! (Acil giriş için 'kurtar' yazabilirsiniz)", "error");
                    }
                }
            });
        }

        function unlockApp() {
            const auth = document.getElementById('auth-screen');
            auth.classList.replace('opacity-100', 'opacity-0');
            setTimeout(() => { 
                auth.classList.add('hidden'); 
                initApp(); 
            }, 500);
        }

        window.logout = function() {
            document.getElementById('auth-form').reset();
            const btn = document.getElementById('auth-submit-btn'); 
            btn.disabled = false; 
            btn.innerText = localStorage.getItem('ard_auth_creds_v8') ? "Giriş Yap" : "Sistemi Başlat";
            
            const auth = document.getElementById('auth-screen'); 
            const main = document.getElementById('main-app');
            main.classList.replace('opacity-100', 'opacity-0');
            
            setTimeout(() => { 
                main.classList.add('hidden'); 
                auth.classList.remove('hidden'); 
                setTimeout(() => auth.classList.replace('opacity-0', 'opacity-100'), 50); 
            }, 500);
        };

        async function initApp() {
            const main = document.getElementById('main-app'); 
            main.classList.remove('hidden'); 
            setTimeout(() => main.classList.replace('opacity-0', 'opacity-100'), 50);
            await initCloud();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'success' ? 'bg-slate-800 text-white dark:bg-brand-600' : 'bg-red-500 text-white';
            toast.className = `toast-enter flex items-center px-4 py-3 rounded-xl shadow-xl text-sm font-bold ${colors}`;
            toast.innerHTML = message;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.replace('toast-enter', 'toast-leave'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        let confirmCallback = null;
        function customConfirm(title, message, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-box');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
            confirmCallback = callback;
        }

        window.closeConfirm = function() {
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-box');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            confirmCallback = null;
        };
        
        document.getElementById('confirm-cancel').onclick = closeConfirm;
        document.getElementById('confirm-ok').onclick = () => { if(confirmCallback) confirmCallback(); closeConfirm(); };

        const bgThemes = { 
            'standart': 'bg-slate-100 dark:bg-slate-900', 
            'dernek': 'bg-slate-100 dark:bg-slate-900', 
            'mavi': 'bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-slate-900 dark:to-blue-900/30' 
        };

        window.setBgTheme = function(themeKey) {
            const body = document.getElementById('app-body');
            Object.values(bgThemes).forEach(cls => cls.split(' ').forEach(c => { if(c) body.classList.remove(c) }));
            const existingWatermark = document.getElementById('theme-watermark');
            if(existingWatermark) existingWatermark.remove();
            
            if(bgThemes[themeKey]) { bgThemes[themeKey].split(' ').forEach(c => { if(c) body.classList.add(c) }); }
            
            if(themeKey === 'dernek') {
                const watermark = document.createElement('div'); 
                watermark.id = 'theme-watermark';
                watermark.className = 'fixed inset-0 pointer-events-none flex items-center justify-center z-[-1] opacity-[0.08] dark:opacity-[0.15] overflow-hidden';
                watermark.innerHTML = `<svg class="w-[80vw] h-[80vh] min-w-[500px]" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M250 50 L120 400 L200 400 L230 310 L350 310 L380 400 L460 400 L320 50 Z M250 160 L245 230 L320 230 Z" fill="#0f766e"/><path d="M 320 230 C 420 220 440 280 380 340 C 330 390 220 380 220 380 C 220 380 340 370 330 270 Z" fill="#14b8a6"/></svg>`;
                document.body.appendChild(watermark);
            }
            localStorage.setItem('ard_theme', themeKey);
        };

        function initTheme() {
            const toggleBtn = document.getElementById('theme-toggle'); 
            const themeIcon = document.getElementById('theme-icon');
            if (localStorage.getItem('ard_darkMode') === 'true' || (!('ard_darkMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark'); 
                themeIcon.textContent = '☀';
            } else { 
                document.documentElement.classList.remove('dark'); 
                themeIcon.textContent = '🌙'; 
            }
            
            const savedBg = localStorage.getItem('ard_theme') || 'dernek'; 
            setBgTheme(savedBg);
            
            toggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('ard_darkMode', isDark); 
                themeIcon.textContent = isDark ? '☀️' : '🌙';
            });
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container'); 
            if (!container) return;
            container.innerHTML = '';
            events.forEach(ev => {
                const isActive = ev.id === activeEventId; 
                const tab = document.createElement('div');
                tab.className = `group flex items-center justify-between px-3 py-3 rounded-xl cursor-pointer text-sm font-bold transition-all border ${isActive ? 'bg-brand-500 border-brand-500 text-white shadow-md' : 'bg-white dark:bg-slate-800/50 border-slate-200 dark:border-slate-700 text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800'}`;
                
                const icon = ev.isGeneral 
                    ? '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>' 
                    : '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>';
                
                let delBtn = ev.isGeneral 
                    ? '<div class="w-6"></div>' 
                    : `<button class="opacity-100 lg:opacity-0 group-hover:opacity-100 ${isActive ? 'text-brand-200 hover:text-white hover:bg-brand-600' : 'text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30'} p-1.5 rounded-lg transition-all" onclick="deleteEvent('${ev.id}', event)" title="Sil"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>`;
                
                tab.innerHTML = `<div class="flex items-center gap-3 overflow-hidden"><span class="flex-shrink-0 opacity-80">${icon}</span> <span class="truncate">${ev.name}</span></div> ${delBtn}`; 
                tab.onclick = () => switchTab(ev.id); 
                container.appendChild(tab);
            });
        }

        window.switchTab = (id) => {
             activeEventId = id; 
             saveDataLocally(); 
             const isGen = id === 'general';
             const formCard = document.getElementById('add-form-card');
             const commonCard = document.getElementById('common-participants-card');
             if (formCard) formCard.style.display = isGen ? 'none' : 'block';
             if (commonCard) commonCard.style.display = isGen ? 'block' : 'none';
             renderTabs(); 
             renderTableAndStats();
        };

        function updateDataLists() {
            const uniqueFacs = [...new Set(participants.map(p => p.faculty).filter(Boolean))];
            const uniqueDeps = [...new Set(participants.map(p => p.department).filter(Boolean))];
            
            const facList = document.getElementById('faculty-list');
            const depList = document.getElementById('department-list');
            
            if(facList) facList.innerHTML = uniqueFacs.map(f => `<option value="${f}">`).join('');
            if(depList) depList.innerHTML = uniqueDeps.map(d => `<option value="${d}">`).join('');
        }

        function createProgressHTML(label, count, percentage, barColor) {
            return `<div class="mb-3 last:mb-0"><div class="flex justify-between text-xs mb-1"><span class="font-medium text-slate-600 dark:text-slate-300 capitalize truncate pr-2">${label}</span><span class="text-slate-400 font-medium">${count} <span class="text-slate-800 dark:text-slate-100 font-bold ml-1">%${percentage}</span></span></div><div class="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"><div class="h-full rounded-full ${barColor}" style="width: ${percentage}%"></div></div></div>`;
        }

        function renderTableAndStats() {
            const tbody = document.getElementById('table-body'); 
            const emptyState = document.getElementById('empty-state');
            if (!tbody || !emptyState) return;

            const ev = events.find(e => e.id === activeEventId);
            const titleEl = document.getElementById('table-title');
            if (titleEl) titleEl.innerText = activeEventId === 'general' ? 'Tüm Kayıtlar' : `${ev ? ev.name : ''} Listesi`;
            
            let currentData = activeEventId === 'general' ? participants : participants.filter(p => p.eventId === activeEventId);
            if (searchTerm) { 
                const term = searchTerm.toLowerCase(); 
                currentData = currentData.filter(p => p.name.toLowerCase().includes(term)); 
            }
            
            tbody.innerHTML = '';
            if (currentData.length === 0) { 
                emptyState.classList.remove('hidden'); 
                emptyState.classList.add('flex'); 
            } else {
                emptyState.classList.add('hidden'); 
                emptyState.classList.remove('flex');
                currentData.forEach(p => {
                    const evName = events.find(e => e.id === p.eventId)?.name || 'Bilinmeyen';
                    const phoneStr = p.phone ? `<div class="text-xs text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap">📞 ${p.phone}</div>` : '';
                    const emailStr = p.email ? `<div class="text-xs text-slate-500 dark:text-slate-400 font-medium truncate max-w-[120px]" title="${p.email}">📧 ${p.email}</div>` : '';
                    const contactStr = (phoneStr || emailStr) ? `<div class="flex flex-col gap-0.5">${phoneStr}${emailStr}</div>` : '<span class="text-slate-300 dark:text-slate-600">-</span>';
                    const row = document.createElement('tr'); 
                    row.className = 'hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors group';
                    const genderStyles = p.gender === 'Kız' ? 'bg-pink-50 text-pink-600 dark:bg-pink-500/10 dark:text-pink-400 border-pink-100 dark:border-pink-500/20' : 'bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400 border-blue-100 dark:border-blue-500/20';
                    row.innerHTML = `
                        <td class="px-4 py-2.5 font-bold text-slate-700 dark:text-slate-200 capitalize">${p.name}</td>
                        <td class="px-4 py-2.5"><span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold border ${genderStyles}">${p.gender}</span></td>
                        <td class="px-4 py-2.5 capitalize text-slate-600 dark:text-slate-300 font-medium">${p.faculty}</td>
                        <td class="px-4 py-2.5 capitalize text-slate-500 dark:text-slate-400">${p.department}</td>
                        <td class="px-4 py-2.5">${contactStr}</td>
                        <td class="px-4 py-2.5"><span class="px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded text-[10px] font-bold text-slate-500 dark:text-slate-400">${evName}</span></td>
                        <td class="px-4 py-2.5 text-right opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity">
                            <div class="flex justify-end gap-1">
                                <button onclick="startEdit('${p.id}')" class="p-1.5 text-slate-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg cursor-pointer" title="Düzenle"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                <button onclick="deleteParticipant('${p.id}')" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg cursor-pointer" title="Sil"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                            </div>
                        </td>`;
                    tbody.appendChild(row);
                });
            }
            updateStats(currentData); 
            if (activeEventId === 'general') renderCommon(); 
            updateDataLists(); 
        }

        function updateStats(data) {
            currentFilteredData = data;
            const tot = data.length; 
            document.getElementById('total-count').innerText = tot;
            const f = data.filter(p => p.gender === 'Kız').length; 
            const m = data.filter(p => p.gender === 'Erkek').length;
            const fP = tot === 0 ? 0 : Math.round((f/tot)*100); 
            const mP = tot === 0 ? 0 : Math.round((m/tot)*100);
            
            document.getElementById('female-bar').style.width = `${fP}%`; 
            document.getElementById('male-bar').style.width = `${mP}%`;
            document.getElementById('female-text').innerText = `${f} Kız (%${fP})`; 
            document.getElementById('male-text').innerText = `${m} Erkek (%${mP})`;
            
            const facs = {}, deps = {};
            data.forEach(p => { 
                if(p.faculty) facs[p.faculty] = (facs[p.faculty] || 0) + 1; 
                if(p.department) deps[p.department] = (deps[p.department] || 0) + 1; 
            });
            
            document.getElementById('unique-faculties').innerText = Object.keys(facs).length; 
            document.getElementById('unique-departments').innerText = Object.keys(deps).length;
            
            const facEl = document.getElementById('faculty-stats'); 
            facEl.innerHTML = '';
            Object.entries(facs).sort((a,b)=>b[1]-a[1]).forEach(([k,v], i) => { 
                facEl.innerHTML += createProgressHTML(`${i+1}. ${k}`, v, Math.round((v/tot)*100), 'bg-brand-500'); 
            });

            const filterSelect = document.getElementById('faculty-filter');
            const currentSelection = filterSelect.value;
            filterSelect.innerHTML = '<option value="all">TÜM FAKÜLTELER</option>';
            Object.keys(facs).sort().forEach(fName => {
                filterSelect.innerHTML += `<option value="${fName}">${fName.toUpperCase()}</option>`;
            });
            
            if (facs[currentSelection]) filterSelect.value = currentSelection;
            else filterSelect.value = 'all';

            renderDepartmentStats();
        }

        window.renderDepartmentStats = () => {
            const filterVal = document.getElementById('faculty-filter').value;
            let dataToProcess = currentFilteredData;
            
            if (filterVal !== 'all') { 
                dataToProcess = currentFilteredData.filter(p => p.faculty === filterVal); 
            }

            const depEl = document.getElementById('department-stats'); 
            const emptyEl = document.getElementById('dep-empty-state');
            depEl.innerHTML = '';
            
            const tot = dataToProcess.length;
            if (tot === 0) {
                depEl.classList.add('hidden'); 
                emptyEl.classList.remove('hidden'); 
                emptyEl.classList.add('flex'); 
                return;
            } else {
                depEl.classList.remove('hidden'); 
                emptyEl.classList.add('hidden'); 
                emptyEl.classList.remove('flex');
            }

            const deps = {};
            dataToProcess.forEach(p => { if(p.department) deps[p.department] = (deps[p.department] || 0) + 1; });
            Object.entries(deps).sort((a,b)=>b[1]-a[1]).forEach(([k,v], i) => { 
                depEl.innerHTML += createProgressHTML(`${i+1}. ${k}`, v, Math.round((v/tot)*100), 'bg-indigo-500'); 
            });
        };

        function renderCommon() {
            const list = document.getElementById('common-list'); 
            if (!list) return;
            list.innerHTML = ''; 
            const map = {};
            participants.forEach(p => { 
                const k = p.name.toLowerCase().trim(); 
                if(!map[k]) map[k] = { name: p.name, gen: p.gender, evs: new Set() }; 
                map[k].evs.add(p.eventId); 
            });
            const common = Object.values(map).filter(x => x.evs.size > 1).sort((a,b) => b.evs.size - a.evs.size);
            if(common.length === 0) { 
                list.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center">Birden fazla etkinliğe katılan kişi yok.</p>'; 
                return; 
            }
            common.forEach(c => {
                const evNames = Array.from(c.evs).map(id => { const e = events.find(x => x.id === id); return e ? e.name : 'Bilinmeyen'; });
                list.innerHTML += `<div class="p-3 rounded-xl border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30"><div class="flex items-center justify-between mb-2"><div class="flex items-center gap-2"><span class="w-6 h-6 rounded-full flex items-center justify-center bg-slate-200 dark:bg-slate-700 text-[10px]">${c.gen==='Kız'?'👩':'👨'}</span><span class="font-bold text-sm text-slate-700 dark:text-slate-200 capitalize">${c.name}</span></div><span class="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400 text-[10px] font-bold px-2 py-0.5 rounded border border-indigo-100 dark:border-indigo-500/20">${c.evs.size} Etkinlik</span></div><div class="flex flex-wrap gap-1">${evNames.map(n=>`<span class="bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-[9px] uppercase tracking-wider font-bold px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700 shadow-sm">${n}</span>`).join('')}</div></div>`;
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => { 
            searchTerm = e.target.value; 
            renderTableAndStats(); 
        });
        
        document.getElementById('add-tab-btn').onclick = () => {
            const val = document.getElementById('new-tab-name').value.trim();
            if(val) { 
                const id = 'tab_' + Math.random().toString(36).substr(2,9); 
                events.push({id, name: val}); 
                document.getElementById('new-tab-name').value = ''; 
                saveDataLocally(); 
                switchTab(id); 
                showToast(`"${val}" eklendi.`); 
            }
        };
        
        window.deleteEvent = (id, e) => {
            e.stopPropagation(); 
            customConfirm("Etkinliği Sil", "Bu etkinliği ve içindeki kayıtları silmek istiyor musunuz?", () => { 
                events = events.filter(x => x.id !== id); 
                participants = participants.filter(x => x.eventId !== id); 
                saveDataLocally(); 
                switchTab('general'); 
                showToast("Etkinlik silindi."); 
            });
        };
        
        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault(); 
            const data = { 
                id: editingParticipantId || Math.random().toString(36).substr(2,9), 
                eventId: activeEventId, 
                name: document.getElementById('name').value.trim(), 
                faculty: document.getElementById('faculty').value.trim(), 
                department: document.getElementById('department').value.trim(), 
                gender: document.getElementById('gender').value, 
                phone: document.getElementById('phone').value.trim(), 
                email: document.getElementById('email').value.trim() 
            };
            if(editingParticipantId) { 
                const idx = participants.findIndex(x => x.id === editingParticipantId); 
                if(idx !== -1) participants[idx] = data; 
                window.cancelEdit(); 
                showToast("Kayıt güncellendi."); 
            } else { 
                participants.push(data); 
                showToast("Kişi eklendi!"); 
            }
            e.target.reset(); 
            document.getElementById('autocomplete-list').classList.add('hidden'); 
            saveDataLocally(); 
            renderTableAndStats(); 
            document.getElementById('name').focus();
        });
        
        window.deleteParticipant = (id) => { 
            customConfirm("Kaydı Sil", "Bu kişiyi listeden kaldırmak istiyor musunuz?", () => { 
                participants = participants.filter(x => x.id !== id); 
                saveDataLocally(); 
                renderTableAndStats(); 
                showToast("Kayıt silindi."); 
            }); 
        };
        
        window.startEdit = (id) => {
            const p = participants.find(x => x.id === id); 
            if(!p) return; 
            editingParticipantId = id;
            document.getElementById('name').value = p.name; 
            document.getElementById('faculty').value = p.faculty; 
            document.getElementById('department').value = p.department; 
            document.getElementById('gender').value = p.gender; 
            document.getElementById('phone').value = p.phone || ''; 
            document.getElementById('email').value = p.email || '';
            document.getElementById('submit-btn').innerText = 'Güncelle'; 
            document.getElementById('cancel-edit-btn').classList.remove('hidden'); 
            document.getElementById('form-title').innerText = 'Kaydı Düzenle';
        };
        
        window.cancelEdit = function() { 
            editingParticipantId = null; 
            document.getElementById('add-form').reset(); 
            document.getElementById('submit-btn').innerText = 'Kaydet'; 
            document.getElementById('cancel-edit-btn').classList.add('hidden'); 
            document.getElementById('form-title').innerText = 'Yeni Kayıt Ekle'; 
        };
        document.getElementById('cancel-edit-btn').onclick = window.cancelEdit;
        
        document.getElementById('name').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim(); 
            const list = document.getElementById('autocomplete-list');
            if(val.length < 2) { list.classList.add('hidden'); return; }
            const unique = {}; 
            participants.filter(p => p.name.toLowerCase().includes(val)).forEach(p => unique[p.name.toLowerCase()] = p);
            const matches = Object.values(unique); 
            if(matches.length === 0) { list.classList.add('hidden'); return; }
            list.innerHTML = matches.map(m => `<div class="px-3 py-2 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer transition-colors" onclick="selectAutocomplete('${m.id}')"><div class="font-bold capitalize text-sm text-slate-700 dark:text-slate-200">${m.name}</div><div class="text-[10px] text-slate-400 font-medium">${m.faculty} • ${m.department}</div></div>`).join('');
            list.classList.remove('hidden');
        });
        
        window.selectAutocomplete = (id) => {
            const p = participants.find(x => x.id === id);
            if(p) { 
                document.getElementById('name').value = p.name; 
                document.getElementById('faculty').value = p.faculty; 
                document.getElementById('department').value = p.department; 
                document.getElementById('gender').value = p.gender; 
                document.getElementById('phone').value = p.phone || ''; 
                document.getElementById('email').value = p.email || ''; 
            }
            document.getElementById('autocomplete-list').classList.add('hidden');
        };
        
        window.exportToCSV = () => {
            const curr = activeEventId === 'general' ? participants : participants.filter(p => p.eventId === activeEventId);
            if(curr.length === 0) return showToast("Dışa aktarılacak veri yok!", "error");
            const headers = ['Ad Soyad', 'Cinsiyet', 'Fakulte', 'Bolum', 'Telefon', 'E-Posta', 'Etkinlik'];
            const rows = curr.map(p => { 
                const ev = events.find(e => e.id === p.eventId); 
                return [p.name, p.gender, p.faculty, p.department, p.phone || '', p.email || '', ev ? ev.name : ''].map(v => `"${v}"`).join(','); 
            });
            const csv = ["\uFEFF" + headers.join(','), ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); 
            const url = URL.createObjectURL(blob); 
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = `Dernek_Liste_${Date.now()}.csv`;
            a.click(); 
            URL.revokeObjectURL(url); 
            showToast("Excel dosyası indirildi.");
        };
        
        window.exportBackup = () => {
            const data = JSON.stringify({events, participants, activeEventId}, null, 2); 
            const blob = new Blob([data], {type: 'application/json'}); 
            const url = URL.createObjectURL(blob); 
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = `ARD_Yedek_${Date.now()}.json`;
            a.click(); 
            URL.revokeObjectURL(url); 
            showToast("Yedek dosyası indirildi.");
        };

        window.importBackup = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.events && data.participants) {
                        events = data.events;
                        participants = data.participants;
                        if(data.activeEventId) activeEventId = data.activeEventId;
                        await saveDataLocally(); 
                        renderTabs(); 
                        renderTableAndStats();
                        showToast("Veriler başarıyla yüklendi ve buluta senkronize edildi!");
                    } else { 
                        showToast("Geçersiz dosya formatı!", "error"); 
                    }
                } catch (err) { 
                    showToast("Dosya okunamadı!", "error"); 
                }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        };

        window.addEventListener('DOMContentLoaded', () => { 
            initTheme(); 
            setupAuth(); 
        });
    </script>
</body>
</html>
