<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARDER - Yönetim & Analiz Paneli</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiiciIHI9IjE0IiBmaWxsPSIjMTBiOTgxIi8+PHBhdGggZD0iTTkgMTdsNSA1IDktOSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjwvc3ZnPg==">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">

    <!-- GİRİŞ EKRANI -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md border border-slate-200 dark:border-slate-700">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-brand-500 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-3 shadow-lg shadow-brand-500/30">AR</div>
                <h2 class="text-2xl font-bold tracking-tight">Yönetim Paneli</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Yetkili e-posta ve şifrenizle giriş yapın</p>
            </div>
            <form id="auth-form" onsubmit="return false;" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">E-Posta</label>
                    <input type="email" id="auth-email" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="admin@dernek.org">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Şifre</label>
                    <input type="password" id="auth-password" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="••••••••">
                </div>
                <div id="auth-error" class="hidden p-3 rounded-xl bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 text-xs font-medium"></div>
                <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl shadow-lg shadow-brand-500/25 transition">Giriş Yap</button>
            </form>
        </div>
    </div>

    <!-- ANA PANEL -->
    <div id="main-app" class="opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col min-h-screen">
        <!-- Üst Bar -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-brand-500 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md">AR</div>
                    <div>
                        <h1 class="text-base sm:text-lg font-bold leading-tight">Akademik Renkler Derneği</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Yönetim & Katılımcı Analizi</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="sync-badge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Bulut Aktif
                    </span>
                    <button onclick="logout()" class="p-2 text-slate-500 hover:text-red-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition" title="Çıkış Yap">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- İçerik -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Sol Panel: Etkinlikler -->
            <div class="lg:col-span-1 space-y-4">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500">Etkinlikler</h2>
                        <button onclick="openNewEventModal()" class="text-xs font-bold text-brand-600 hover:text-brand-700 flex items-center gap-1">+ Yeni Ekle</button>
                    </div>
                    <div id="tabs-container" class="space-y-1.5"></div>
                </div>

                <!-- Kaynak Dağılım Kartı -->
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Duyuru / Kaynak Dağılımı</h3>
                    <div id="source-stats" class="space-y-2 text-xs"></div>
                </div>
            </div>

            <!-- Sağ Panel: Liste & Filtreler -->
            <div class="lg:col-span-3 space-y-4">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                    <div class="relative flex-1">
                        <input type="text" id="search-input" oninput="renderTable()" placeholder="İsim, bölüm veya telefon ara..." class="w-full pl-9 pr-4 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="source-filter" onchange="renderTable()" class="text-xs py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900 font-medium">
                            <option value="">Tüm Kaynaklar</option>
                            <option value="Instagram">Instagram</option>
                            <option value="WhatsApp Grupları">WhatsApp Grupları</option>
                            <option value="Afiş / Stant">Afiş / Stant</option>
                            <option value="Arkadaş Tavsiyesi">Arkadaş Tavsiyesi</option>
                            <option value="Diğer">Diğer</option>
                        </select>
                        <button onclick="openParticipantModal()" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-bold shadow-md shadow-brand-500/20 transition flex items-center gap-1.5">
                            + Katılımcı Ekle
                        </button>
                    </div>
                </div>

                <!-- Tablo -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 dark:bg-slate-900/50 text-slate-400 uppercase text-[11px] font-bold border-b border-slate-200 dark:border-slate-700">
                                <tr>
                                    <th class="px-4 py-3">Ad Soyad</th>
                                    <th class="px-4 py-3">Bölüm</th>
                                    <th class="px-4 py-3">İletişim</th>
                                    <th class="px-4 py-3">Nereden Duydu?</th>
                                    <th class="px-4 py-3 text-right">İşlem</th>
                                </tr>
                            </thead>
                            <tbody id="participant-tbody" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- KATILIMCI MODAL -->
    <div id="participant-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-700 shadow-2xl">
            <h3 id="participant-modal-title" class="text-lg font-bold mb-4">Yeni Katılımcı Ekle</h3>
            <form id="participant-form" onsubmit="saveParticipant(event)" class="space-y-3">
                <input type="hidden" id="part-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Ad Soyad *</label>
                    <input type="text" id="part-name" required class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Bölüm / Meslek</label>
                    <input type="text" id="part-dept" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Telefon</label>
                    <input type="tel" id="part-phone" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700" placeholder="05XXXXXXXXX">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Etkinliği Nereden Duydu?</label>
                    <select id="part-source" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700">
                        <option value="Instagram">Instagram</option>
                        <option value="WhatsApp Grupları">WhatsApp Grupları</option>
                        <option value="Afiş / Stant">Afiş / Stant</option>
                        <option value="Arkadaş Tavsiyesi">Arkadaş Tavsiyesi</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeParticipantModal()" class="px-4 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300">İptal</button>
                    <button type="submit" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white font-bold text-sm rounded-xl">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ETKİNLİK İSMİ DÜZENLEME MODAL -->
    <div id="edit-event-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 border border-slate-200 dark:border-slate-700 shadow-2xl">
            <h3 class="text-base font-bold mb-3">Etkinlik Adını Düzenle</h3>
            <input type="hidden" id="edit-event-id">
            <input type="text" id="edit-event-name" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 mb-4">
            <div class="flex justify-end gap-2">
                <button onclick="document.getElementById('edit-event-modal').classList.add('hidden')" class="px-3 py-1.5 text-xs rounded-lg border border-slate-200">İptal</button>
                <button onclick="saveEventName()" class="px-3 py-1.5 bg-brand-500 text-white font-bold text-xs rounded-lg">Güncelle</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & JS -->
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDNxbTOFwit25u20nZ1Fez2vjNEXna4K4E",
            authDomain: "arderanaliz.firebaseapp.com",
            databaseURL: "https://arderanaliz-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "arderanaliz",
            storageBucket: "arderanaliz.firebasestorage.app",
            messagingSenderId: "343442116812",
            appId: "1:343442116812:web:1e3e0c2643bd937bc87269"
        };

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(app);
        const db = getDatabase(app);

        let events = [{ id: 'all', name: 'Tüm Etkinlikler', isGeneral: true }];
        let participants = [];
        let activeEventId = 'all';

        // Kimlik Denetimi
        onAuthStateChanged(auth, user => {
            const authScreen = document.getElementById('auth-screen');
            const mainApp = document.getElementById('main-app');
            if (user) {
                authScreen.classList.add('hidden');
                mainApp.classList.remove('opacity-0', 'pointer-events-none');
                startSync();
            } else {
                authScreen.classList.remove('hidden');
                mainApp.classList.add('opacity-0', 'pointer-events-none');
            }
        });

        // Giriş Yap Butonu
        document.getElementById('auth-submit-btn').onclick = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            const errBox = document.getElementById('auth-error');
            errBox.classList.add('hidden');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                errBox.textContent = "Giriş başarısız: " + (err.message.includes('auth') ? "Hatalı e-posta veya şifre" : err.message);
                errBox.classList.remove('hidden');
            }
        };

        window.logout = () => signOut(auth);

        // Veri Senkronizasyonu
        function startSync() {
            const dataRef = ref(db, 'ard_crm_data');
            onValue(dataRef, snapshot => {
                const val = snapshot.val();
                if (val) {
                    if (val.events) events = val.events;
                    if (val.participants) participants = val.participants;
                    renderTabs();
                    renderTable();
                    renderSourceStats();
                }
            });
        }

        async function saveAllData() {
            try {
                await set(ref(db, 'ard_crm_data'), { events, participants });
            } catch (e) {
                console.error("Kayıt hatası:", e);
            }
        }

        // Sekmeler
        window.renderTabs = () => {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            events.forEach(ev => {
                const isActive = ev.id === activeEventId;
                const tab = document.createElement('div');
                tab.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-xs font-bold border transition ${isActive ? 'bg-brand-500 border-brand-500 text-white shadow-sm' : 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'}`;
                
                let actions = '';
                if (!ev.isGeneral) {
                    actions = `
                        <div class="flex items-center gap-1">
                            <button onclick="openEditEvent('${ev.id}', '${ev.name}', event)" class="p-1 hover:text-blue-200"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                            <button onclick="deleteEvent('${ev.id}', event)" class="p-1 hover:text-red-200"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                        </div>
                    `;
                }

                tab.innerHTML = `<span class="truncate">${ev.name}</span> ${actions}`;
                tab.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    activeEventId = ev.id;
                    renderTabs();
                    renderTable();
                    renderSourceStats();
                };
                container.appendChild(tab);
            });
        };

        // Tablo
        window.renderTable = () => {
            const tbody = document.getElementById('participant-tbody');
            tbody.innerHTML = '';
            const search = document.getElementById('search-input').value.toLowerCase();
            const sourceFilter = document.getElementById('source-filter').value;

            const filtered = participants.filter(p => {
                const matchesEvent = activeEventId === 'all' || p.eventId === activeEventId;
                const matchesSearch = (p.name || '').toLowerCase().includes(search) || 
                                      (p.department || '').toLowerCase().includes(search) || 
                                      (p.phone || '').includes(search);
                const matchesSource = !sourceFilter || p.source === sourceFilter;
                return matchesEvent && matchesSearch && matchesSource;
            });

            const sourceColors = {
                'Instagram': 'bg-pink-100 text-pink-700 dark:bg-pink-900/40 dark:text-pink-300',
                'WhatsApp Grupları': 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300',
                'Afiş / Stant': 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300',
                'Arkadaş Tavsiyesi': 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300',
                'Diğer': 'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300'
            };

            filtered.forEach(p => {
                const tr = document.createElement('tr');
                const badgeColor = sourceColors[p.source] || sourceColors['Diğer'];
                const sourceBadge = `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold ${badgeColor}">${p.source || 'Belirtilmedi'}</span>`;

                tr.innerHTML = `
                    <td class="px-4 py-3 font-semibold">${p.name}</td>
                    <td class="px-4 py-3 text-slate-500">${p.department || '-'}</td>
                    <td class="px-4 py-3">${p.phone || '-'}</td>
                    <td class="px-4 py-3">${sourceBadge}</td>
                    <td class="px-4 py-3 text-right">
                        <div class="flex justify-end gap-1">
                            <button onclick="editParticipant('${p.id}')" class="p-1 text-slate-400 hover:text-blue-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                            <button onclick="deleteParticipant('${p.id}')" class="p-1 text-slate-400 hover:text-red-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        // Kaynak Analiz İstatistikleri
        window.renderSourceStats = () => {
            const statBox = document.getElementById('source-stats');
            const targetParts = participants.filter(p => activeEventId === 'all' || p.eventId === activeEventId);
            const total = targetParts.length;

            if (total === 0) {
                statBox.innerHTML = '<span class="text-slate-400 italic">Veri bulunamadı</span>';
                return;
            }

            const counts = {};
            targetParts.forEach(p => {
                const src = p.source || 'Belirtilmedi';
                counts[src] = (counts[src] || 0) + 1;
            });

            statBox.innerHTML = Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .map(([src, count]) => {
                    const percent = Math.round((count / total) * 100);
                    return `
                        <div>
                            <div class="flex justify-between mb-0.5">
                                <span class="font-medium text-slate-600 dark:text-slate-300">${src}</span>
                                <span class="font-bold">${count} (%${percent})</span>
                            </div>
                            <div class="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                <div class="bg-brand-500 h-full rounded-full" style="width: ${percent}%"></div>
                            </div>
                        </div>
                    `;
                }).join('');
        };

        // Katılımcı Kaydet
        window.saveParticipant = async (e) => {
            e.preventDefault();
            const id = document.getElementById('part-id').value;
            const name = document.getElementById('part-name').value;
            const department = document.getElementById('part-dept').value;
            const phone = document.getElementById('part-phone').value;
            const source = document.getElementById('part-source').value;

            if (id) {
                const p = participants.find(x => x.id === id);
                if (p) {
                    p.name = name;
                    p.department = department;
                    p.phone = phone;
                    p.source = source;
                }
            } else {
                participants.push({
                    id: 'p_' + Date.now(),
                    eventId: activeEventId === 'all' ? (events[1]?.id || 'default') : activeEventId,
                    name,
                    department,
                    phone,
                    source
                });
            }
            await saveAllData();
            closeParticipantModal();
            renderTable();
            renderSourceStats();
        };

        window.openParticipantModal = () => {
            document.getElementById('participant-form').reset();
            document.getElementById('part-id').value = '';
            document.getElementById('participant-modal-title').textContent = 'Yeni Katılımcı Ekle';
            document.getElementById('participant-modal').classList.remove('hidden');
        };

        window.closeParticipantModal = () => {
            document.getElementById('participant-modal').classList.add('hidden');
        };

        window.editParticipant = (id) => {
            const p = participants.find(x => x.id === id);
            if (!p) return;
            document.getElementById('part-id').value = p.id;
            document.getElementById('part-name').value = p.name;
            document.getElementById('part-dept').value = p.department || '';
            document.getElementById('part-phone').value = p.phone || '';
            document.getElementById('part-source').value = p.source || 'Instagram';
            document.getElementById('participant-modal-title').textContent = 'Katılımcıyı Düzenle';
            document.getElementById('participant-modal').classList.remove('hidden');
        };

        window.deleteParticipant = async (id) => {
            if (!confirm("Katılımcıyı silmek istediğinize emin misiniz?")) return;
            participants = participants.filter(x => x.id !== id);
            await saveAllData();
            renderTable();
            renderSourceStats();
        };

        // Etkinlik İşlemleri
        window.openNewEventModal = async () => {
            const name = prompt("Yeni Etkinlik Adı:");
            if (!name) return;
            events.push({ id: 'ev_' + Date.now(), name, isGeneral: false });
            await saveAllData();
            renderTabs();
        };

        window.openEditEvent = (id, currentName, e) => {
            e.stopPropagation();
            document.getElementById('edit-event-id').value = id;
            document.getElementById('edit-event-name').value = currentName;
            document.getElementById('edit-event-modal').classList.remove('hidden');
        };

        window.saveEventName = async () => {
            const id = document.getElementById('edit-event-id').value;
            const newName = document.getElementById('edit-event-name').value;
            if (!newName) return;
            const ev = events.find(x => x.id === id);
            if (ev) ev.name = newName;
            await saveAllData();
            document.getElementById('edit-event-modal').classList.add('hidden');
            renderTabs();
        };

        window.deleteEvent = async (id, e) => {
            e.stopPropagation();
            if (!confirm("Etkinliği ve bu etkinliğin tüm kayıtlarını silmek istiyor musunuz?")) return;
            events = events.filter(x => x.id !== id);
            participants = participants.filter(x => x.eventId !== id);
            if (activeEventId === id) activeEventId = 'all';
            await saveAllData();
            renderTabs();
            renderTable();
            renderSourceStats();
        };
    </script>
</body>
</html>
